<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Factura Zibra Digital</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;font:14px Arial;color:#441717}
.app{max-width:1000px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.brand{font-size:20px;font-weight:bold}.brand b{background:#3264f5;color:#fff;padding:10px;border-radius:9px;margin-right:7px}
button{border:0;border-radius:8px;padding:10px 13px;font-weight:bold;cursor:pointer}.blue{background:#ff0000;color:#fff}.white{background:#fff;border:1px solid #dce3ee}
.layout{display:grid;grid-template-columns:1fr 370px;gap:18px}.card{background:#fff;border:1px solid #e1e7f0;border-radius:14px;padding:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:12px;font-weight:bold;margin-bottom:5px}
input,textarea,select{width:100%;border:1px solid #d7dfeb;border-radius:8px;padding:10px;font:inherit}textarea{min-height:58px}.wide{grid-column:1/-1}
hr{border:0;border-top:1px solid #e5eaf2;margin:20px 0}.item{display:grid;grid-template-columns:1fr 55px 95px 80px 25px;gap:7px;margin-bottom:8px}
.item input{padding:8px}.amount{text-align:right;padding-top:9px;font-weight:bold}.delete{background:none;color:#c24b5c;font-size:20px;padding:0}
.add{background:#edf2ff;color:#ff0000}.bottom{display:grid;grid-template-columns:1fr 205px;gap:13px;margin-top:15px;align-items:end}
.totals{background:#f6f8fc;padding:13px;border-radius:10px}.line{display:flex;justify-content:space-between;color:#64748b;margin:7px 0}
.line input{width:82px;border:0;background:none;text-align:right;padding:0;font-weight:bold}.final{border-top:1px solid #dbe3ee;padding-top:9px;font-weight:bold;color:#172744}
.head{display:flex;align-items:center;gap:10px;border-bottom:1px solid #e5eaf2;padding-bottom:16px}.logo{width:85px;height:85px;background:#f2f5fa;border-radius:9px;display:grid;place-items:center;overflow:hidden;text-align:center;font-size:10px;color:#8e6060;cursor:pointer}.logo img{width:100%;height:100%;object-fit:contain}
.company{font-size:17px;font-weight:bold;flex:1}.company small,.meta span{display:block;font-size:11px;font-weight:normal;color:#718099;margin-top:4px}.meta{text-align:right}
.client{margin:19px 0}.client h3{margin:5px 0}.client p{margin:0;white-space:pre-line;color:#f80000}table{width:100%;border-collapse:collapse;font-size:12px}th{background:#f3f6fa;text-align:left;color:#718099;padding:8px}td{padding:9px;border-bottom:1px solid #edf1f5}th:last-child,td:last-child{text-align:right}
.sum{width:210px;margin:18px 0 18px auto}.sum div,.sum strong{display:flex;justify-content:space-between;margin:7px 0}.sum strong{border-top:2px solid #172744;padding-top:9px;font-size:16px}
@media(max-width:700px){body{padding-bottom:70px}.app{padding:0}.top{padding:12px;background:#fff;position:sticky;top:0;z-index:2}.layout{grid-template-columns:1fr}.card{border-radius:0;border-left:0;border-right:0}.grid,.bottom{grid-template-columns:1fr}.item{grid-template-columns:1fr 1fr 25px;padding:9px;background:#f7f9fc;border-radius:9px}.item input:first-child{grid-column:1/-1}.amount{display:none}.delete{grid-column:3;grid-row:2}.top .actions{position:fixed;bottom:0;left:0;width:100%;padding:9px;background:#fff;display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}.top button{padding:11px 4px;font-size:12px}.sum{width:100%}}
@media print{.top,.form{display:none}.app{padding:0}.layout{display:block}.card{border:0}}
</style>
</head>
<body>
<main class="app">
<header class="top">
  <div class="brand"><b>F</b>Factura Zibra Digital</div>
  <div class="actions">
    <button class="white" onclick="nueva()">Nueva</button>
    <button class="white" onclick="guardar()">Guardar</button>
    <button class="blue" onclick="print()">PDF</button>
  </div>
</header>

<section class="layout">
<article class="card form">
  <h2>Nueva factura</h2>
  <div class="grid">
    <div><label>Número</label><input id="numero" type="number" value="1"></div>
    <div><label>Fecha</label><input id="fecha" type="date"></div>
    <div><label>Fecha límite</label><input id="vence" type="date"></div>
    <div><label>Estado</label><select id="estado"><option>Pendiente de pago</option><option>Pagada</option><option>Vencida</option></select></div>
  </div>
  <hr>
  <h2>Cliente</h2>
  <div class="grid">
    <div><label>Nombre del restaurante

    </label><input id="cliente"></div>
    <div class="wide"><label>Dirección</label><textarea id="contacto"></textarea></div>
  </div>
  <hr>
  <h2>Productos y servicios</h2>
  <div id="items"></div>
  <button class="add" onclick="agregar()">+ Añadir producto</button>

  <div class="bottom">
    <div><label>Notas</label><textarea id="notas">Gracias por su compra. Pago por transferencia bancaria.</textarea></div>
    <div class="totals">
      <div class="line"><span>Subtotal</span><b id="subtotal">$0</b></div>
      <div class="line"><span>Descuento</span><span><input id="descuento" type="number" value="0"> COP</span></div>
      <div class="line final"><span>Total</span><b id="total">$0</b></div>
      <div class="line"><span>Abono</span><span><input id="abono" type="number" value="0"> COP</span></div>
      <div class="line final"><span>Saldo</span><b id="saldo">$0</b></div>
    </div>
  </div>
</article>

<aside class="card">
  <div class="head">
    <label class="logo">
      <input id="archivoLogo" type="file" accept="image/*" hidden>
      <span id="textoLogo">PONER<br>LOGO</span>
      <img id="imagenLogo" hidden>
    </label>
    <div class="company">ZIBRA DIGITAL<br>301-293-4630</small></div>
    <div class="meta"><b>FACTURA</b><span id="vNumero"></span><span id="vFecha"></span></div>
  </div>

  <div class="client"><small>FACTURAR A</small><h3 id="vCliente">Nombre del cliente</h3><p id="vContacto">Información del cliente</p></div>

  <table>
    <thead><tr><th>Concepto</th><th>Cant.</th><th>Total</th></tr></thead>
    <tbody id="vItems"></tbody>
  </table>

  <div class="sum">
    <div><span>Subtotal</span><span id="vSubtotal"></span></div>
    <div><span>Descuento</span><span id="vDescuento"></span></div>
    <strong><span>TOTAL</span><span id="vTotal"></span></strong>
    <div><span>Abono recibido</span><span id="vAbono"></span></div>
    <strong><span>SALDO</span><span id="vSaldo"></span></strong>
  </div>

  <small id="vNotas"></small>
</aside>
</section>
</main>

<script>
const $ = id => document.getElementById(id);
let productos = [];

const dinero = valor => new Intl.NumberFormat('es-CO',{
  style:'currency',currency:'COP',maximumFractionDigits:0
}).format(valor || 0);

$('fecha').value = new Date().toISOString().slice(0,10);
let limite = new Date();
limite.setDate(limite.getDate()+30);
$('vence').value = limite.toISOString().slice(0,10);

function agregar(nombre='', cantidad=1, precio=0){
  const producto = {nombre,cantidad,precio};
  productos.push(producto);

  const fila = document.createElement('div');
  fila.className = 'item';
  fila.innerHTML = `
    <input placeholder="Producto o servicio" value="${nombre}">
    <input type="number" value="${cantidad}">
    <input type="number" value="${precio}">
    <span class="amount"></span>
    <button class="delete">×</button>
  `;

  $('items').appendChild(fila);
  const inputs = fila.querySelectorAll('input');

  inputs[0].oninput = () => { producto.nombre = inputs[0].value; actualizar(); };
  inputs[1].oninput = () => { producto.cantidad = Number(inputs[1].value); actualizar(); };
  inputs[2].oninput = () => { producto.precio = Number(inputs[2].value); actualizar(); };

  fila.querySelector('.delete').onclick = () => {
    productos = productos.filter(p => p !== producto);
    fila.remove();
    actualizar();
  };

  actualizar();
}

function actualizar(){
  const subtotal = productos.reduce((s,p) => s + p.cantidad * p.precio, 0);
  const descuento = Math.min(Number($('descuento').value) || 0, subtotal);
  const total = subtotal - descuento;
  const abono = Math.min(Number($('abono').value) || 0, total);
  const saldo = total - abono;

  document.querySelectorAll('.item').forEach((fila,i) => {
    fila.querySelector('.amount').textContent =
      dinero(productos[i].cantidad * productos[i].precio);
  });

  $('subtotal').textContent = dinero(subtotal);
  $('total').textContent = dinero(total);
  $('saldo').textContent = dinero(saldo);

  $('vNumero').textContent = 'N.º ' + $('numero').value;
  $('vFecha').textContent = $('fecha').value;
  $('vCliente').textContent = $('cliente').value || 'Nombre del cliente';
  $('vContacto').textContent =
    [$('correo').value,$('contacto').value].filter(Boolean).join('\n') ||
    'Información del cliente';

  $('vItems').innerHTML = productos.map(p => `
    <tr><td>${p.nombre || 'Sin descripción'}</td><td>${p.cantidad}</td><td>${dinero(p.cantidad*p.precio)}</td></tr>
  `).join('');

  $('vSubtotal').textContent = dinero(subtotal);
  $('vDescuento').textContent = '- ' + dinero(descuento);
  $('vTotal').textContent = dinero(total);
  $('vAbono').textContent = '- ' + dinero(abono);
  $('vSaldo').textContent = dinero(saldo);
  $('vNotas').textContent = $('notas').value;
}

function nueva(){
  $('numero').value = Number($('numero').value) + 1;
  $('fecha').value = new Date().toISOString().slice(0,10);
  $('cliente').value = '';
  $('correo').value = '';
  $('contacto').value = '';
  $('descuento').value = 0;
  $('abono').value = 0;
  productos = [];
  $('items').innerHTML = '';
  agregar('',1,0);
  actualizar();
}

function guardar(){
  localStorage.setItem('factura_' + $('numero').value, JSON.stringify({
    numero:$('numero').value,
    cliente:$('cliente').value,
    productos
  }));
  alert('Factura guardada.');
}

['numero','fecha','vence','estado','cliente','correo','contacto','notas','descuento','abono']
  .forEach(id => $(id).addEventListener('input', actualizar));

$('archivoLogo').onchange = e => {
  const archivo = e.target.files[0];
  if(!archivo) return;

  const lector = new FileReader();
  lector.onload = () => {
    localStorage.setItem('logoEmpresa', lector.result);
    $('imagenLogo').src = lector.result;
    $('imagenLogo').hidden = false;
    $('textoLogo').hidden = true;
  };
  lector.readAsDataURL(archivo);
};

const logo = localStorage.getItem('logoEmpresa');
if(logo){
  $('imagenLogo').src = logo;
  $('imagenLogo').hidden = false;
  $('textoLogo').hidden = true;
}

agregar('Servicio profesional',1,850000);
agregar('Soporte mensual',1,120000);
actualizar();
</script>
</body>
</html>
